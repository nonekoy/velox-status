name: Update Template
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install uptime monitor
        run: npm install -g @upptime/uptime-monitor

      - name: Update template
        run: uptime-monitor update-template
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          OWNER: nonekoy
          REPO: velox-status
