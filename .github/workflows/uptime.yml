name: Uptime CI
on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  summary:
    name: Check status of sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libcurl
        run: sudo apt-get install -y libcurl4-openssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install uptime monitor
        run: npm install -g @upptime/uptime-monitor

      - name: Update status
        run: uptime-monitor update-status
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          OWNER: nonekoy
          REPO: velox-status
