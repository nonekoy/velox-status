name: Uptime CI
on:
  push:
    branches:
      - master
  repository_dispatch:
    types: [upptime]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  summary:
    name: Check status of sites
    runs-on: ubuntu-latest
    steps:
      - name: Upptime
        uses: upptime/upptime@master
        with:
          ASSIGNEES: nonekoy
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
